[project]
name = "done-claims"
version = "1.0.0"
description = "How often coding agents submit without running anything after their last edit"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub==2.4.0",
    "pyarrow==26.0.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 110
target-version = "py312"
